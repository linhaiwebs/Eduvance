services:
  mysql:
    image: mysql:5.7
    container_name: eduvance_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eduvance
      MYSQL_USER: eduvance_user
      MYSQL_PASSWORD: eduvance_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - eduvance_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:6-alpine
    container_name: eduvance_redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - eduvance_network

  eduvance:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduvance_app
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
    env_file:
      - .env.docker
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - eduvance_network

volumes:
  mysql_data:
    driver: local

networks:
  eduvance_network:
    driver: bridge
