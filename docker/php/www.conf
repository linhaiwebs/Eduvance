[www]
; ===== PHP-FPM Pool Configuration for Docker =====

; Ensure environment variables are passed to PHP processes
; Default is "yes" which CLEARS all env vars - this is the root cause of DB connection failures
clear_env = no

; Pool settings
user = www-data
group = www-data

listen = 9000
pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Logging
php_admin_value[error_log] = /var/log/php/error.log
php_admin_flag[log_errors] = on

; Allow larger uploads
php_value[upload_max_filesize] = 500M
php_value[post_max_size] = 550M
php_value[max_execution_time] = 300
