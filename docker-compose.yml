version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:5.7
    container_name: eduvance_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eduvance
      MYSQL_USER: eduvance_user
      MYSQL_PASSWORD: eduvance_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - eduvance_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:6-alpine
    container_name: eduvance_redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - eduvance_network

  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.fpm
    container_name: eduvance_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - eduvance_network

  # Nginx Web Server
  nginx:
    image: nginx:1.19-alpine
    container_name: eduvance_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - eduvance_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  eduvance_network:
    driver: bridge
